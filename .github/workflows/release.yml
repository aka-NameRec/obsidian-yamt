name: build-and-release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: zip -r yamt.zip . -x ".git/*" "node_modules/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: yamt.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}